<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Data Science DevOps Toolkit</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header>
    <h1>Data Science DevOps Toolkit (preview)</h1>
    <input id="search" placeholder="Поиск..." />
  </header>
  <main>
    <aside class="left-panel">
      <div class="filters">
        <button data-filter="all" class="active">Все</button>
        <button data-filter="dataTypes">Data Types</button>
        <button data-filter="apis">APIs</button>
        <button data-filter="devops">DevOps</button>
      </div>
      <div class="top-stack">
        <h3>Top stack (2026)</h3>
        <ul>
          <li>Parquet / Arrow / Delta</li>
          <li>FastAPI / OpenAPI</li>
          <li>Docker + Kubernetes</li>
          <li>GitHub Actions</li>
          <li>Prometheus + Grafana</li>
        </ul>
      </div>
    </aside>

    <section class="cards" id="cards"></section>

    <aside class="right-panel" id="detail">
      <div class="placeholder">Выберите карточку для подробностей</div>
    </aside>
  </main>

  <script src="src/toolkit.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
